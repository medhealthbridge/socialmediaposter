<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Poster</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--mut:#6b7385;--line:#e3e6ec;--acc:#2b5cff;--ok:#1a9a5b;--bad:#d33;--warn:#c27a00}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf2;--mut:#98a1b5;--line:#2b3240;--acc:#6b8cff}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:4px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 16px 0 0}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--mut);cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1100px;margin:16px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media(max-width:800px){.grid{grid-template-columns:1fr}}
textarea,input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:130px;resize:vertical}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
button.p{background:var(--acc);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
button.s{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
button.d{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.published{color:var(--ok);border-color:var(--ok)}.failed{color:var(--bad);border-color:var(--bad)}.partial,.publishing{color:var(--warn);border-color:var(--warn)}.scheduled{color:var(--acc);border-color:var(--acc)}
.cnt{font-size:12px;color:var(--mut)}.over{color:var(--bad);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal>div{background:var(--card);min-height:92px;padding:4px;overflow:hidden}.cal .h{min-height:0;text-align:center;color:var(--mut);font-size:12px;padding:6px}
.cal .dim{opacity:.45}.cal .d{font-size:12px;color:var(--mut)}
.ev{font-size:11px;padding:2px 4px;margin-top:2px;border-radius:4px;background:var(--bg);border-left:3px solid var(--acc);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.published{border-color:var(--ok)}.ev.failed{border-color:var(--bad)}.ev.draft{border-color:var(--mut)}
.post{border-top:1px solid var(--line);padding:10px 0}.post:first-child{border:0}
.err{color:var(--bad);font-size:12px}.bar{height:8px;background:var(--acc);border-radius:3px}
.hint{color:var(--mut);font-size:12px}#toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:none}
</style>
</head>
<body>
<header>
  <h1>📣 Social Poster</h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<script src="app.js" type="module"></script>
</body>
</html>
